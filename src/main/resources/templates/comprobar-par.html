<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Comprobar Número Par</title>
</head>
<body>
    <h2>Comprobar si un número es par</h2>
    
    <form th:action="@{/comprobar-par}" th:object="${numeroData}" method="post">
        <label for="numero">Introduce un número:</label>
        <input type="number" id="numero" th:field="*{numero}" />
        <span th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}">Error</span>
        <br/><br/>
        <button type="submit">Comprobar</button>
    </form>
</body>
</html>
